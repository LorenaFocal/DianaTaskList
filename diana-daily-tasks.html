<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diana's Daily Tasks</title>
<style>
  :root {
    --bg: #fdf1f6;
    --surface: #ffffff;
    --ink: #3b2f4a;
    --muted: #7a6c8a;
    --line: #f1d9e6;
    --pink: #ff9ec7;
    --pink-soft: #ffe3ef;
    --pink-ink: #a22f66;
    --mint: #7fd8b4;
    --mint-soft: #dcf6ea;
    --mint-ink: #1d6b4c;
    --sky: #8cc7ff;
    --sky-soft: #def0ff;
    --sky-ink: #1f5a94;
    --shadow: 0 6px 0 rgba(255, 158, 199, .35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #231a2e;
      --surface: #2f2340;
      --ink: #f6eafc;
      --muted: #c3b2d4;
      --line: #4a3a60;
      --pink-soft: #4a2a40;
      --pink-ink: #ffc2dc;
      --mint-soft: #1f4a3b;
      --mint-ink: #a8f0d2;
      --sky-soft: #1f3a58;
      --sky-ink: #bfe0ff;
      --shadow: 0 6px 0 rgba(255, 158, 199, .2);
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Nunito", ui-rounded, "SF Pro Rounded", "Quicksand", "Trebuchet MS", system-ui, sans-serif;
    line-height: 1.5;
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 22px; }
  .sparkles { font-size: 1.3rem; letter-spacing: .4em; }
  h1 {
    font-size: clamp(2rem, 7vw, 2.7rem);
    margin: 6px 0 4px;
    font-weight: 900;
    letter-spacing: -.01em;
  }
  h1 .name {
    background: var(--pink-soft);
    padding: 0 .35em;
    border-radius: 14px;
    display: inline-block;
    transform: rotate(-2deg);
  }
  .date { color: var(--muted); margin: 0; font-weight: 700; }

  .progress {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 22px;
    padding: 14px 18px;
    margin-bottom: 24px;
  }
  .progress-top { display: flex; justify-content: space-between; font-weight: 800; margin-bottom: 8px; }
  .bar { height: 16px; background: var(--pink-soft); border-radius: 999px; overflow: hidden; }
  .fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, var(--pink), var(--mint));
    border-radius: 999px;
    transition: width .35s ease;
  }
  .cheer { margin: 10px 0 0; text-align: center; font-weight: 800; color: var(--pink-ink); min-height: 1.5em; }

  section {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 28px;
    padding: 20px 18px 10px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  section h2 { margin: 0 0 12px; font-size: 1.25rem; font-weight: 900; }

  ul { list-style: none; margin: 0; padding: 0; }
  li { border-top: 2px dashed var(--line); display: flex; align-items: center; }
  li:first-child { border-top: 0; }

  label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 4px;
    font-weight: 700;
    cursor: pointer;
  }
  input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    flex: none;
    width: 30px; height: 30px;
    margin: 0;
    border: 3px solid var(--pink);
    border-radius: 50%;
    background: var(--surface);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background .15s ease, transform .15s ease;
  }
  input[type="checkbox"]::after {
    content: "✓";
    font-weight: 900;
    font-size: 1rem;
    color: #134d36;
    transform: scale(0);
    transition: transform .15s ease;
  }
  input[type="checkbox"]:checked { background: var(--mint); border-color: var(--mint); }
  input[type="checkbox"]:checked::after { transform: scale(1); }
  input[type="checkbox"]:active { transform: scale(.9); }
  input[type="checkbox"]:focus-visible,
  button:focus-visible,
  .add input[type="text"]:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }

  .text { flex: 1; }
  input:checked ~ .text { text-decoration: line-through; color: var(--muted); }

  .tag {
    flex: none;
    font-size: .74rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
  }
  .tag.done { background: var(--mint-soft); color: var(--mint-ink); }
  .tag.doing { background: var(--sky-soft); color: var(--sky-ink); }

  .remove {
    flex: none;
    border: 0; background: transparent;
    color: var(--muted);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 10px;
  }
  .remove:hover { background: var(--pink-soft); color: var(--pink-ink); }

  .add { display: flex; gap: 10px; padding: 6px 0 14px; }
  .add input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-weight: 700;
    padding: 10px 14px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--ink);
  }
  button.primary {
    font: inherit; font-weight: 800;
    border: 0;
    border-radius: 999px;
    padding: 10px 18px;
    background: var(--pink);
    color: #4a1230;
    cursor: pointer;
  }
  button.primary:active { transform: scale(.96); }

  .actions { text-align: center; }
  button.ghost {
    font: inherit; font-weight: 800;
    background: transparent;
    border: 2px solid var(--line);
    color: var(--muted);
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }
  button.ghost:hover { background: var(--pink-soft); color: var(--pink-ink); }
  .note { color: var(--muted); font-size: .85rem; font-weight: 600; margin: 12px 0 0; text-align: center; }

  @media (max-width: 440px) {
    .tag { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="sparkles" aria-hidden="true">✨ 🌸 ✨</div>
    <h1>Diana's <span class="name">Tasks</span></h1>
    <p class="date" id="date"></p>
  </header>

  <div class="progress" aria-live="polite">
    <div class="progress-top"><span id="count">0 of 0 done</span><span id="pct">0%</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <p class="cheer" id="cheer"></p>
  </div>

  <section>
    <h2>🌟 Fully trained</h2>
    <ul id="list-trained"></ul>
  </section>

  <section>
    <h2>🌱 In process</h2>
    <ul id="list-process"></ul>
  </section>

  <section>
    <h2>📝 My extras</h2>
    <ul id="list-custom"></ul>
    <div class="add">
      <input type="text" id="new-task" placeholder="Add a task for today" maxlength="120" aria-label="New task">
      <button class="primary" id="add-btn" type="button">Add</button>
    </div>
  </section>

  <div class="actions">
    <button class="ghost" id="reset-btn" type="button">Uncheck everything</button>
    <p class="note">Checkmarks start fresh every morning. Your extras stay until you remove them.</p>
  </div>
</div>

<script>
  const TRAINED = [
    { id: "t1", text: "Respond to reviews" },
    { id: "t2", text: "Moving pre appts until March 2027" }
  ];
  const PROCESS = [
    { id: "p1", text: "HIPAA Submissions" },
    { id: "p2", text: "Emails (4pc emails)" },
    { id: "p3", text: "VES emails and schedule" },
    { id: "p4", text: "Provide glasses and CL status (Empire and Omega)" },
    { id: "p5", text: "Insurance vision and medical for next week" },
    { id: "p6", text: "Virtual field/Carrot and neurolens" }
  ];

  const KEY = "diana-daily-tasks";
  let memoryStore = null;
  let state = { date: today(), done: {}, custom: [] };

  function today() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  async function loadState() {
    let raw = null;
    try {
      if (window.storage) {
        const r = await window.storage.get(KEY, false);
        raw = r && r.value;
      }
    } catch (e) { /* no saved data yet */ }
    if (!raw) {
      try { raw = window.localStorage.getItem(KEY); } catch (e) { raw = memoryStore; }
    }
    if (raw) {
      try {
        const saved = JSON.parse(raw);
        state.custom = saved.custom || [];
        state.done = saved.date === today() ? (saved.done || {}) : {};
      } catch (e) { /* ignore bad data */ }
    }
  }

  async function saveState() {
    const raw = JSON.stringify(state);
    memoryStore = raw;
    try {
      if (window.storage) { await window.storage.set(KEY, raw, false); return; }
    } catch (e) { /* fall through */ }
    try { window.localStorage.setItem(KEY, raw); } catch (e) { /* memory only */ }
  }

  function escapeText(s) {
    const d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function rowHTML(task, tagClass, tagLabel, removable) {
    const checked = state.done[task.id] ? "checked" : "";
    const tag = tagLabel ? '<span class="tag ' + tagClass + '">' + tagLabel + "</span>" : "";
    const remove = removable
      ? '<button class="remove" type="button" data-remove="' + task.id + '" aria-label="Remove ' + escapeText(task.text) + '">✕</button>'
      : "";
    return '<li><label><input type="checkbox" data-id="' + task.id + '" ' + checked + ">" +
      '<span class="text">' + escapeText(task.text) + "</span>" + tag + "</label>" + remove + "</li>";
  }

  function render() {
    document.getElementById("list-trained").innerHTML = TRAINED.map(t => rowHTML(t, "done", "Fully trained", false)).join("");
    document.getElementById("list-process").innerHTML = PROCESS.map(t => rowHTML(t, "doing", "In process", false)).join("");
    document.getElementById("list-custom").innerHTML = state.custom.length
      ? state.custom.map(t => rowHTML(t, "", "", true)).join("")
      : '<li style="padding:10px 4px;color:var(--muted);font-weight:600;">Nothing extra today. Add one below if you need to.</li>';
    updateProgress();
  }

  function updateProgress() {
    const all = TRAINED.concat(PROCESS, state.custom);
    const done = all.filter(t => state.done[t.id]).length;
    const pct = all.length ? Math.round((done / all.length) * 100) : 0;
    document.getElementById("count").textContent = done + " of " + all.length + " done";
    document.getElementById("pct").textContent = pct + "%";
    document.getElementById("fill").style.width = pct + "%";
    let msg = "";
    if (all.length && done === all.length) msg = "All done! Great job today, Diana! 🎉";
    else if (pct >= 50) msg = "Over halfway there! 💪";
    else if (done > 0) msg = "Nice start! 🌸";
    document.getElementById("cheer").textContent = msg;
  }

  document.addEventListener("change", function (e) {
    const id = e.target.dataset && e.target.dataset.id;
    if (!id) return;
    if (e.target.checked) state.done[id] = true; else delete state.done[id];
    saveState();
    updateProgress();
  });

  document.addEventListener("click", function (e) {
    const rid = e.target.dataset && e.target.dataset.remove;
    if (rid) {
      state.custom = state.custom.filter(t => t.id !== rid);
      delete state.done[rid];
      saveState();
      render();
    }
  });

  function addTask() {
    const input = document.getElementById("new-task");
    const text = input.value.trim();
    if (!text) return;
    state.custom.push({ id: "c" + Date.now(), text: text });
    input.value = "";
    saveState();
    render();
    input.focus();
  }
  document.getElementById("add-btn").addEventListener("click", addTask);
  document.getElementById("new-task").addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  document.getElementById("reset-btn").addEventListener("click", function () {
    state.done = {};
    saveState();
    render();
  });

  document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });

  loadState().then(function () { state.date = today(); saveState(); render(); });
</script>
</body>
</html>
